<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - POWER GYM</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>

        <h1>POWER GYM</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <main>

        <section class="contact">

            <h2>Contact Us</h2>

            <form>

                <label for="name">Name:</label>

                <input type="text" id="name" name="name">

                <br>

                <label for="email">Email:</label>

                <input type="email" id="email" name="email">

                <br>

                <label for="phone">Phone Number:</label>

                <input type="number" id="phone" name="phone">

                <br>

                <label for="date">Date:</label>

                <input type="date" id="date" name="date">

                <br>

                <label>Gender:</label>

                <br>
                <label for="male">Male</label>   

                <input type="radio" id="male" name="gender" value="male">


                <br>

                <label for="female">Female</label>
              
                <input type="radio" id="female" name="gender" value="female">

                

                <br>

                <label>Services:</label>

                <br>
                <label for="gym">Gym</label>

                <input type="checkbox" id="gym" name="service" value="gym">

                

                <br>
                 <label for="cardio">Cardio</label>

                <input type="checkbox" id="cardio" name="service" value="cardio">

               

                <br>

                <label for="personal">Personal Training</label>

                <input type="checkbox" id="personal" name="service" value="personal">

                

                <br>

                <label for="membership">Membership:</label>

                <br>

                <select id="membership" name="membership">

                    <option>Monthly</option>

                    <option>3 Months</option>

                    <option>6 Months</option>

                    <option>Yearly</option>

                </select>

                <br>

                <label for="message">Message:</label>

                <br>

                <textarea id="message" name="message" rows="5"></textarea>

                <br>
                <audio src="C:\Users\A\Music\WhatsApp Audio 2026-10-07 at 12.36.25 AM.mpeg" controls></audio>
                <button type="submit">Send</button>

            </form>

        </section>

    </main>

    <footer>

        <p>POWER GYM </p>

    </footer>

</body>

</html>
